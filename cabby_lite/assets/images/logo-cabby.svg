<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Cabby Ride">
  <title>Cabby Ride</title>
  <!-- Route mark: a 250° arc opening right — reads as a C and as a route in
       motion. Same geometry as icon-cabby.svg, terminals at 55° and 305°. -->
  <g transform="translate(0 8)">
    <path d="M 42.32,46.74 A 18,18 0 1 1 42.32,17.26"
          fill="none" stroke="#0A7C42" stroke-width="8" stroke-linecap="round"/>
    <!-- Leading tip, the moving end of the route. -->
    <path d="M 33.57,14.07 A 18,18 0 0 1 42.32,17.26"
          fill="none" stroke="#27C281" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="76" y="56"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="44" letter-spacing="-1.5">
    <tspan fill="#0A7C42">Cabby</tspan><tspan fill="currentColor"> Ride</tspan>
  </text>
</svg>
